server:
  # Railway 등은 PORT 환경변수로 포트를 알려줌
  port: ${PORT:8080}
  # 프록시(HTTPS 종료) 뒤에서 X-Forwarded-* 헤더를 따름
  forward-headers-strategy: framework
spring:
  application:
    name: gdgoc-office
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul
    # Jackson 3은 날짜를 기본으로 숫자 타임스탬프가 아닌 문자열로 씁니다 (형식은 JacksonConfig)
jwt:
  secret: ${JWT_SECRET}
  access-expiration-minutes: 30
  refresh-expiration-days: 14
springdoc:
  override-with-generic-response: false
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: method
    persist-authorization: true
app:
  cors:
    # 쉼표 구분. 예: https://agency.vercel.app,https://*.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    # true면 운영진 계정·초대 코드·기본 키워드를 넣음 (이미 있으면 건너뜀). local 프로필은 항상 켜짐
    enabled: ${APP_SEED_ENABLED:false}
    admin-login-id: ${ADMIN_LOGIN_ID:admin}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:운영진}
