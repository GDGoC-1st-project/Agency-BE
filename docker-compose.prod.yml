# 배포 서버(EC2 등)에서 MySQL + 백엔드를 함께 띄울 때
#   cp .env.prod.example .env.prod   # 값 채우기
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# BACKEND_IMAGE 를 비우면 이 폴더의 Dockerfile 로 빌드하고,
# GitHub Actions 에서 ECR 등에 올린 이미지를 쓰려면 BACKEND_IMAGE 에 그 주소를 넣습니다.
# RDS 를 쓰면 mysql 서비스를 지우고 DB_URL 을 RDS 주소로 바꿉니다.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 필요}
      MYSQL_DATABASE: gdgoc_office
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME 필요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:-agency-be:latest}
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/gdgoc_office?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요 (32바이트 이상)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 필요}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:?CORS_ALLOWED_ORIGIN_PATTERNS 필요 (예 https://agency.example.com)}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  mysql-data:
